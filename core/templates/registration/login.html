<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        :root {
            --bg-dark: #020817;
            --bg-mid: #0f172a;
            --bg-light: #111827;
            --card-bg: rgba(15, 23, 42, 0.8);
            --card-border: rgba(148, 163, 184, 0.18);
            --primary: #38bdf8;
            --primary-strong: #0ea5e9;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.9);
            --input-border: rgba(148, 163, 184, 0.28);
            --shadow: rgba(14, 116, 144, 0.28);
            --success: #34d399;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            height: 100%;
        }

        body {
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.25), transparent 32%),
                radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.15), transparent 28%),
                linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-mid) 45%, var(--bg-light) 100%);
            color: var(--text);
            overflow: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: auto;
            width: 34rem;
            height: 34rem;
            border-radius: 50%;
            background: rgba(56, 189, 248, 0.08);
            filter: blur(18px);
            pointer-events: none;
        }

        body::before {
            top: -12rem;
            left: -8rem;
        }

        body::after {
            right: -9rem;
            bottom: -12rem;
        }

        .login-card {
            position: relative;
            width: min(100%, 430px);
            padding: 2.3rem 2rem 1.75rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            box-shadow: 0 25px 50px rgba(2, 6, 23, 0.7), 0 0 0 1px rgba(56, 189, 248, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            margin: 0 auto 1rem;
            padding: 0.5rem 0.9rem;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.09);
            border: 1px solid rgba(56, 189, 248, 0.21);
            color: var(--primary);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .brand-mark {
            width: 0.62rem;
            height: 0.62rem;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #a78bfa);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
        }

        h1 {
            margin: 0 0 1.5rem;
            text-align: center;
            font-size: clamp(2rem, 5vw, 2.5rem);
            line-height: 1.1;
            letter-spacing: -0.05em;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
        }

        label {
            font-size: 0.93rem;
            font-weight: 600;
            color: var(--muted);
        }

        input {
            width: 100%;
            padding: 0.96rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            outline: none;
            border-color: rgba(56, 189, 248, 0.9);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.16);
            transform: translateY(-1px);
        }

        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-top: -0.1rem;
            color: var(--muted);
            font-size: 0.83rem;
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .remember input {
            width: 0.95rem;
            height: 0.95rem;
            accent-color: var(--primary);
            margin: 0;
        }

        .forgot {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 1rem 1rem;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            box-shadow: 0 18px 34px rgba(14, 165, 233, 0.35);
            transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 38px rgba(14, 165, 233, 0.4);
            filter: brightness(1.03);
        }

        button:active {
            transform: translateY(0);
        }

        .switch-link {
            margin: 0.5rem 0 0;
            text-align: center;
            color: var(--muted);
            font-size: 0.94rem;
        }

        .switch-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 1.7rem 1.2rem 1.3rem;
                border-radius: 18px;
            }

            .form-row {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Login</h1>

        <form method="post" action="">
            <div class="field-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" placeholder="Enter your username" required>
            </div>

            <div class="field-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
            </div>

            <div class="form-row">
                <label class="remember">
                    <input type="checkbox" name="remember">
                    Remember me
                </label>
                <a class="forgot" href="#">Forgot password?</a>
            </div>

            <button type="submit">Login</button>

            <p class="switch-link">Don't have an account? <a href="{% url 'register' %}">Register</a></p>
        </form>
    </main>
</body>
</html>
