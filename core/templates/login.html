<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        :root {
            --bg-1: #0f172a;
            --bg-2: #1e293b;
            --card-bg: rgba(15, 23, 42, 0.82);
            --card-border: rgba(148, 163, 184, 0.2);
            --primary: #60a5fa;
            --primary-dark: #3b82f6;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.9);
            --input-border: rgba(148, 163, 184, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at top, #1e293b 0%, var(--bg-1) 45%, #020817 100%);
            color: var(--text);
        }

        .login-card {
            width: min(100%, 420px);
            padding: 2.2rem 2rem 1.5rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(2, 6, 23, 0.55);
            backdrop-filter: blur(8px);
        }

        .brand {
            text-align: center;
            margin-bottom: 0.5rem;
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.78rem;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 2rem;
            letter-spacing: -0.04em;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-weight: 600;
            color: var(--muted);
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            font-size: 1rem;
            background: var(--input-bg);
            color: var(--text);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 0.9rem 1rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 12px 24px rgba(59, 130, 246, 0.35);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(59, 130, 246, 0.4);
        }

        .switch-link {
            text-align: center;
            display: block;
            margin-top: 0.75rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .switch-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="brand">Welcome back</div>
        <h1>Login</h1>
        <form method="post" action="">
            <div class="field-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" placeholder="Enter your username" required>
            </div>
            <div class="field-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
            </div>
            <button type="submit">Login</button>
            <p class="switch-link">Don't have an account? <a href="register.html">Register</a></p>
        </form>
    </main>
</body>
</html>
