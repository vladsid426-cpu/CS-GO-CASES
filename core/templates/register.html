<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Register</h1>
            <form method="post" action="">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Enter your password" required>
                </div>

                <button type="submit">Register</button>
            </form>

            <p class="switch-link">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>

    <style>
        :root {
            --bg: #0f172a;
            --card: #111827;
            --card-border: rgba(148, 163, 184, 0.2);
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --input: #1e293b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #020617 0%, #111827 100%);
            font-family: Arial, sans-serif;
            color: var(--text);
        }

        .auth-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 24px;
        }

        .auth-card {
            width: min(100%, 420px);
            background: rgba(17, 24, 39, 0.96);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.45);
            padding: 32px 28px;
        }

        h1 {
            margin: 0 0 24px;
            text-align: center;
            font-size: 2rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: var(--muted);
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: var(--input);
            color: var(--text);
            outline: none;
            font-size: 1rem;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        button {
            width: 100%;
            padding: 12px 16px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: #082f49;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .switch-link {
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
        }

        .switch-link a {
            color: var(--primary);
            text-decoration: none;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }
    </style>
</body>
</html>
