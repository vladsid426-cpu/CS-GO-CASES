<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS-GO Cases</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #111827, #1e293b);
            color: #f8fafc;
        }

        header {
            position: absolute;
            top: 1.5rem;
            right: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        header h1 {
            margin: 0;
            margin-right: 1rem;
            color: #38bdf8;
        }

        .account-link {
            padding: 0.55rem 0.9rem;
            border: 1px solid #475569;
            border-radius: 0.5rem;
            color: #e2e8f0;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .account-link:hover {
            border-color: #38bdf8;
            color: #38bdf8;
        }

        main {
            width: min(90%, 720px);
            padding: 3rem 1.5rem;
            text-align: center;
        }

        section {
            padding: 3rem 2rem;
            border: 1px solid #334155;
            border-radius: 1rem;
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin: 0;
            color: #38bdf8;
        }

        h2 {
            margin-top: 0;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
        }

        .cta {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            background: #0ea5e9;
            color: #fff;
            font-weight: bold;
            text-decoration: none;
        }

        .cta:hover {
            background: #0284c7;
        }
    </style>
</head>
<body>
    <header>
        <h1>CS-GO Cases</h1>
        <a class="account-link" href="#login">Log in</a>
        <a class="account-link" href="#register">Create account</a>
    </header>
    <main>
        <section>
            <h2>Featured Cases</h2>
            <p>Welcome to the world of CS-GO cases! Open cases and discover rare skins.</p>
            <a class="cta" href="#cases">Explore Cases</a>
        </section>

        <section id="account">
            <h2>Account</h2>
            <p>Sign in to save your favorite cases and track your collection.</p>
            <a class="cta" id="login" href="/login">Log in</a>
            <a class="account-link" id="register" href="/register">Create account</a>
        </section>
    </main>
</body>
</html>
